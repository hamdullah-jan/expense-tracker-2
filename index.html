<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💰 Expense Tracker</h1>

        <p class="subtitle">
            Manage your daily expenses easily
        </p>

        <!-- Statistics -->

        <div class="stats">

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpense">Rs. 0</p>
            </div>

            <div class="card">
                <h3>Average Expense</h3>
                <p id="averageExpense">Rs. 0</p>
            </div>

            <div class="card">
                <h3>Total Records</h3>
                <p id="expenseCount">0</p>
            </div>

        </div>


        <!-- Add Expense -->

        <div class="form-box">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    required
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount"
                    min="1"
                    required
                >

                <select id="expenseCategory" required>

                    <option value="">Select Category</option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <input
                    type="date"
                    id="expenseDate"
                    required
                >

                <button type="submit">
                    + Add Expense
                </button>

            </form>

        </div>


        <!-- Search and Filter -->

        <div class="controls">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search expenses..."
            >

            <select id="categoryFilter">

                <option value="All">
                    All Categories
                </option>

                <option value="Food">
                    Food
                </option>

                <option value="Bills">
                    Bills
                </option>

                <option value="Travel">
                    Travel
                </option>

                <option value="Shopping">
                    Shopping
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

            <button id="loadSampleBtn">
                🌐 Load Sample Expenses
            </button>

        </div>


        <!-- Expense Table -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Expense</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="expenseTable">

                </tbody>

            </table>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
